<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

By-Sann Admin Dashboard

</title>

<link
rel="stylesheet"
href="admin.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<div
id="imageModal"

class="imageModal">

    <span
    id="closeImageModal">

        ×

    </span>

    <img
    id="previewImage">

</div>

<div
id="editModal"
class="imageModal">

<div class="editBox">

<h2>Edit RSVP</h2>

<input
id="editName"
placeholder="Nama">

<input
id="editPhone"
placeholder="Telefon">

<select
id="editAttendance">

<option>Hadir</option>

<option>Tidak Hadir</option>

</select>

<input
type="number"
id="editGuest"
placeholder="Bilangan Tetamu">

<button
id="saveEditBtn">

Simpan

</button>

</div>

</div>

<body>

<div class="adminLayout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <h2>By-Sann</h2>

            <small>Admin Panel</small>

        </div>

        <button class="menuBtn active"
        data-page="dashboard">

            <i class="fa-solid fa-chart-line"></i>

            Dashboard

        </button>

        <button class="menuBtn"
        data-page="rsvp">

            <i class="fa-solid fa-users"></i>

            RSVP

        </button>

        <button class="menuBtn"
        data-page="moments">

            <i class="fa-solid fa-images"></i>

            Momen

        </button>

        <button class="menuBtn"
        data-page="wishes">

            <i class="fa-solid fa-heart"></i>

            Ucapan

        </button>

        <button

id="logoutBtn"

class="menuBtn">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>

<button
class="menuBtn"
data-page="settings">

⚙️ Settings

</button>

<button
class="menuBtn"
data-page="media">

🖼️ Media

</button>

    </aside>

    <!-- Main -->

    <main class="mainContent">

        <h1 id="pageTitle">

            Dashboard

        </h1>

        <!-- Statistik -->

        <section
        id="dashboardPage"
        class="pageContent">

            <div class="statsGrid">

                <div class="statCard">

                    <h3 id="totalRsvp">

                        0

                    </h3>

                    <p>

                        RSVP

                    </p>

                </div>

                <div class="statCard">

                    <h3 id="totalMoment">

                        0

                    </h3>

                    <p>

                        Momen

                    </p>

                </div>

                <div class="statCard">

                    <h3 id="totalWish">

                        0

                    </h3>

                    <p>

                        Ucapan

                    </p>

                </div>

            </div>

        </section>

        <!-- RSVP -->

        <section
        id="rsvpPage"
        class="pageContent hidden">

<input
type="text"
id="searchRsvp"
placeholder="Cari nama..."

class="searchBox">

<button
id="exportExcelBtn"
class="exportBtn">

📥 Export Excel

</button>

        </section>

        <!-- Momen -->

        <section
        id="momentsPage"
        class="pageContent hidden">

<input
type="text"
id="searchMoment"
placeholder="Cari gambar..."

class="searchBox">

<div id="momentList"

class="momentGrid">

</div>

        </section>

<!-- Ucapan -->

<section
id="wishesPage"
class="pageContent hidden">

...

</section>

<!-- =========================
     SETTINGS
========================= -->

<section id="settingsPage" class="pageContent hidden">

    <h2>Settings Website</h2>

    <div class="settingsForm">

        <label>Nama Pengantin Lelaki</label>
        <input id="groomName">

        <label>Nama Pengantin Perempuan</label>
        <input id="brideName">

        <label>Tarikh Majlis</label>
        <input type="date" id="weddingDate">

        <label>Masa Majlis</label>
        <input type="time" id="weddingTime">

        <label>Alamat</label>
        <textarea id="address"></textarea>

        <label>Telefon</label>
        <input id="phone">

        <label>WhatsApp</label>
        <input id="whatsapp">

        <label>Google Maps</label>
        <input id="maps">

        <label>Waze</label>
        <input id="waze">

        <label>Music URL</label>
        <input id="music">

        <h3>🖼 Cover Website</h3>

        <input
            type="file"
            id="coverUpload"
            accept="image/*">

        <img
            id="coverPreview"
            class="coverPreview">

        <button id="uploadCover">
            📤 Upload Cover
        </button>

        <label>
            <input type="checkbox" id="rsvpOpen">
            RSVP Dibuka
        </label>

        <label>
            <input type="checkbox" id="momentOpen">
            Momen Dibuka
        </label>

        <label>
            <input type="checkbox" id="wishOpen">
            Ucapan Dibuka
        </label>

        <button id="saveSettings">
            💾 Simpan
        </button>

    </div>

</section>

<!-- =========================
     MEDIA
========================= -->

<section id="mediaPage" class="pageContent hidden">

    <h2>🖼 Media Manager</h2>

    <div class="mediaGrid">

        <div class="mediaCard">

            <h3>Page Images</h3>

            <div id="pageMediaList"></div>

        </div>

    </div>

</section>

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script
type="module"
src="admin.js"></script>

</body>

</html>
