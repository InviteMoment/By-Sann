<!DOCTYPE html>
<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Atikah & Hafiezul | Walimatul Urus
    </title>

    <!-- Favicon -->

    <link
        rel="icon"
        href="images/favicon.png">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css">

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Open Graph -->

    <meta
        property="og:type"
        content="website">

    <meta
        property="og:title"
        content="💙 Atikah & Hafiezul">

    <meta
        property="og:site_name"
        content="By-Sann">

    <meta
        property="og:image"
        content="images/Ecard2026.jpg">

    <meta
        property="og:description"
        content="Walimatul Urus Atikah & Hafiezul">

</head>

<body>
  
<!-- ======================================================
     COVER
====================================================== -->

<div id="cover">

    <div class="coverOverlay"></div>

    <img
        id="envelope"
        src="images/cover.webp"
        alt="Wedding Cover">

</div>

<!-- ======================================================
     WEBSITE
====================================================== -->

<div id="website">

<!-- ======================================================
     PAGE 1
     PEMBUKA
====================================================== -->

<section
    id="page1"
    class="page fade-section">

<img
    id="page1Image"
    src="images/page1.webp"
    alt="opening"
    loading="lazy">

</section>

<!-- ======================================================
     PAGE 2
     JEMPUTAN
====================================================== -->

<section
    id="page2"
    class="page fade-section">

<img
    id="page2Image"
    src="images/page2.webp"
    alt="Jemputan"
    loading="lazy">

</section>

<!-- ======================================================
     PAGE 3
     BUTIRAN MAJLIS
====================================================== -->

<section
    id="page3"
    class="page fade-section">

<img
    id="page3Image"
    src="images/page3.webp"
    alt="Butiran"
    loading="lazy">

</section>

<!-- ======================================================
     PAGE 4
     KALENDAR & PETA
====================================================== -->

<section
    id="page4"
    class="page fade-section">

<img
    id="page4Image"
    src="images/page4.webp"
    alt="Lokasi"
    loading="lazy">

</section>

<!-- ======================================================
     PAGE 5
     ATUR CARA
====================================================== -->

<section
    id="page5"
    class="page fade-section">

<img
    id="page5Image"
    src="images/page5.webp"
    alt="Atur Cara"
    loading="lazy">

</section>

<!-- ======================================================
     PAGE 6
     COUNTDOWN
====================================================== -->

<section
    id="countdown"
    class="page fade-section">

<img
    id="page6Image"
    src="images/page6.webp"
    alt="Countdown"
    loading="lazy">

    <div class="countdownOverlay">

   <div class="timeCard dayCard">
        <span id="days">00</span>
        <small>HARI</small>
    </div>

    <div class="timeCard hourCard">
        <span id="hours">00</span>
        <small>JAM</small>
    </div>

    <div class="timeCard minuteCard">
        <span id="minutes">00</span>
        <small>MINIT</small>
    </div>

    <div class="timeCard secondCard">
        <span id="seconds">00</span>
        <small>SAAT</small>
    </div>

</div>

</section>

<!-- ======================================================
     PAGE 7
     RSVP LIVE
====================================================== -->

<section id="page7" class="page fade-section">

<img
    id="page7Image"
    src="images/page7.webp"
    alt="RSVP"
    loading="lazy">

    <div
        id="rsvpList"
        class="rsvpOverlay">
    </div>

</section>

<!-- ======================================================
     PAGE 8
     MOMEN LIVE
====================================================== -->

<section id="page8" class="page fade-section">

<img
    id="page8Image"
    src="images/page8.webp"
    alt="Momen"
    loading="lazy">

    <div
        id="momentGallery"
        class="momentOverlay">

    </div>

    <input
        type="file"
        id="momentFile"
        accept="image/*"
        hidden>

</section>

<!-- ======================================================
     PAGE 9
     UCAPAN LIVE
====================================================== -->

<section id="page9" class="page fade-section">
  
<img
    id="page9Image"
    src="images/page9.webp"
    alt="Ucapan"
    loading="lazy">

   <div

        id="wishList"

        class="wishList">

    </div>

</section>

<!-- ======================================================
     PAGE 10
     DOA PENUTUP
====================================================== -->

<section
    id="page10"
    class="page fade-section">

<img
    id="page10Image"
    src="images/page10.webp"
    alt="Doa Penutup"
    loading="lazy">

</section>

<!-- ======================================================
     MUSIC
====================================================== -->

<audio
    id="music"
    loop>

    <source
        src="music/song.m4a"
        type="audio/mpeg">

</audio>

<button id="musicBtn">

    <i class="fa-solid fa-music"></i>

</button>

<!-- ======================================================
     BOTTOM SHEET
====================================================== -->

<div id="sheetOverlay"></div>

<div id="bottomSheet">

    <div id="sheetContent"></div>

</div>

<!-- ======================================================
     BOTTOM NAVIGATION
====================================================== -->

<nav id="bottomNav">

    <button id="dateBtn">

        <i class="fa-solid fa-calendar-days"></i>

        <span>Tarikh</span>

    </button>

    <button id="locationBtn">

        <i class="fa-solid fa-location-dot"></i>

        <span>Lokasi</span>

    </button>

    <button id="contactBtn">

        <i class="fa-solid fa-phone"></i>

        <span>Hubungi</span>

    </button>

    <button id="rsvpBtn">

        <i class="fa-solid fa-envelope-open-text"></i>

        <span>RSVP</span>

    </button>

    <button id="galleryBtn">

        <i class="fa-solid fa-images"></i>

        <span>Galeri</span>

    </button>

    <button id="wishBtn">

        <i class="fa-solid fa-heart"></i>

        <span>Ucapan</span>

    </button>

</nav>

<!-- ======================================================
     TOAST
====================================================== -->

<div id="toast"></div>

<!-- ======================================================
     LIGHTBOX
====================================================== -->

<div id="lightbox" class="lightbox">

    <button
        id="closeLightbox"
        aria-label="Tutup">

        <i class="fa-solid fa-xmark"></i>

    </button>

    <button
        id="prevImage"
        class="lightboxNav"
        aria-label="Sebelum">

        <i class="fa-solid fa-chevron-left"></i>

    </button>

    <img
        id="lightboxImage"
        src=""
        alt="Gallery">

    <button
        id="nextImage"
        class="lightboxNav"
        aria-label="Seterusnya">

        <i class="fa-solid fa-chevron-right"></i>

    </button>

</div>

<!-- ======================================================
     FOOTER
====================================================== -->

<footer class="footer">

    <h3>

        Terima Kasih

    </h3>

    <p>

        Semoga dengan kehadiran
        serta doa restu semua tetamu
        akan menyerikan lagi majlis kami
        serta mendapat keberkatan
        daripada Allah SWT.

    </p>

    <small>

        Made with ❤️ by

        <strong>By-Sann</strong>

    </small>

</footer>

</div>

<!-- ======================================================
     SCRIPT
====================================================== -->

<script
    type="module"
    src="script.js"></script>

</body>

</html>
