<!DOCTYPE html>
<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Atikah & Hafiezul | Walimatul Urus
    </title>

    <link
        rel="icon"
        href="images/favicon.png">

    <link
        rel="stylesheet"
        href="style.css">

    <link
        rel="preconnect"
        href="https://cdnjs.cloudflare.com">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <meta
        property="og:type"
        content="website">

    <meta
        property="og:title"
        content="💙 Atikah & Hafiezul">

    <meta
        property="og:site_name"
        content="By-Sann">

    <meta
        property="og:image"
        content="images/Ecard2026.jpg">

    <meta
        property="og:description"
        content="Walimatul Urus Atikah & Hafiezul">

</head>


<body>


<!-- =====================================================
     COVER
===================================================== -->

<div id="cover">

    <button
        id="coverOpenBtn"
        type="button"
        aria-label="Buka undangan">

        <img
            id="envelope"
            src="images/cover.webp"
            alt="Buka Undangan">

    </button>

</div>



<!-- =====================================================
     WEBSITE
===================================================== -->

<main id="website">


    <!-- PAGE 1 -->

    <section
        id="page1"
        class="page fade-section">

        <img
            id="page1Image"
            src="images/page1.webp"
            alt="Pembukaan">

    </section>



    <!-- PAGE 2 -->

    <section
        id="page2"
        class="page fade-section">

        <img
            id="page2Image"
            src="images/page2.webp"
            alt="Jemputan">

    </section>



    <!-- PAGE 3 -->

    <section
        id="page3"
        class="page fade-section">

        <img
            id="page3Image"
            src="images/page3.webp"
            alt="Butiran Majlis">

    </section>



    <!-- PAGE 4 -->

    <section
        id="page4"
        class="page fade-section">

        <img
            id="page4Image"
            src="images/page4.webp"
            alt="Kalendar dan lokasi">

    </section>



    <!-- PAGE 5 -->

    <section
        id="page5"
        class="page fade-section">

        <img
            id="page5Image"
            src="images/page5.webp"
            alt="Atur Cara">

    </section>



    <!-- PAGE 6 COUNTDOWN -->

    <section
        id="countdown"
        class="page fade-section">

        <img
            id="page6Image"
            src="images/page6.webp"
            alt="Countdown"
            loading="lazy">


        <div
            class="countdownOverlay"
            aria-label="Kiraan masa ke majlis">


            <div class="timeCard dayCard">

                <span id="days">
                    00
                </span>

                <small>
                    HARI
                </small>

            </div>


            <div class="timeCard hourCard">

                <span id="hours">
                    00
                </span>

                <small>
                    JAM
                </small>

            </div>


            <div class="timeCard minuteCard">

                <span id="minutes">
                    00
                </span>

                <small>
                    MINIT
                </small>

            </div>


            <div class="timeCard secondCard">

                <span id="seconds">
                    00
                </span>

                <small>
                    SAAT
                </small>

            </div>


        </div>

    </section>



    <!-- PAGE 7 RSVP -->

    <section
        id="page7"
        class="page fade-section">

        <img
            id="page7Image"
            src="images/page7.webp"
            alt="RSVP"
            loading="lazy">


        <div
            id="rsvpList"
            class="rsvpOverlay">
        </div>

    </section>



    <!-- PAGE 8 MOMEN -->

    <section
        id="page8"
        class="page fade-section">

        <img
            id="page8Image"
            src="images/page8.webp"
            alt="Momen"
            loading="lazy">


        <div
            id="momentGallery"
            class="momentOverlay">
        </div>


        <input
            type="file"
            id="momentFile"
            accept="image/*"
            hidden>

    </section>



    <!-- PAGE 9 UCAPAN -->

    <section
        id="page9"
        class="page fade-section">

        <img
            id="page9Image"
            src="images/page9.webp"
            alt="Ucapan"
            loading="lazy">


        <div
            id="wishList"
            class="wishList">
        </div>

    </section>



    <!-- PAGE 10 -->

    <section
        id="page10"
        class="page fade-section">

        <img
            id="page10Image"
            src="images/page10.webp"
            alt="Doa Penutup">

    </section>



    <!-- FOOTER -->

    <footer class="footer">

        <h3>
            Terima Kasih
        </h3>

        <p>
            Semoga dengan kehadiran serta doa restu
            semua tetamu akan menyerikan lagi majlis kami
            serta mendapat keberkatan daripada Allah SWT.
        </p>

        <small>
            Made with ❤️ by
            <strong>By-Sann</strong>
        </small>

    </footer>

</main>



<!-- =====================================================
     MUSIC
===================================================== -->

<audio
    id="music"
    preload="auto"
    loop
    playsinline
    webkit-playsinline>

    <source
        src="./music/song.m4a"
        type="audio/mp4">

</audio>

<button
    id="musicBtn"
    class="floatingMusic"
    type="button"
    aria-label="Muzik">

    <i class="fa-solid fa-music"></i>

</button>



<!-- =====================================================
     BOTTOM SHEET
===================================================== -->

<div
    id="sheetOverlay"
    aria-hidden="true">
</div>


<div
    id="bottomSheet"
    role="dialog"
    aria-modal="true"
    aria-label="Maklumat">

    <div id="sheetContent"></div>

</div>



<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav
    id="bottomNav"
    aria-label="Navigasi utama">


    <button
        id="dateBtn"
        type="button">

        <i class="fa-solid fa-calendar-days"></i>

        <span>
            Tarikh
        </span>

    </button>


    <button
        id="locationBtn"
        type="button">

        <i class="fa-solid fa-location-dot"></i>

        <span>
            Lokasi
        </span>

    </button>


    <button
        id="contactBtn"
        type="button">

        <i class="fa-solid fa-phone"></i>

        <span>
            Hubungi
        </span>

    </button>


    <button
        id="rsvpBtn"
        type="button">

        <i class="fa-solid fa-envelope-open-text"></i>

        <span>
            RSVP
        </span>

    </button>


    <button
        id="galleryBtn"
        type="button">

        <i class="fa-solid fa-images"></i>

        <span>
            Galeri
        </span>

    </button>


    <button
        id="wishBtn"
        type="button">

        <i class="fa-solid fa-heart"></i>

        <span>
            Ucapan
        </span>

    </button>

</nav>



<!-- =====================================================
     TOAST
===================================================== -->

<div
    id="toast"
    role="status"
    aria-live="polite">
</div>



<!-- =====================================================
     LIGHTBOX
===================================================== -->

<div
    id="lightbox"
    class="lightbox"
    aria-hidden="true">


    <button
        id="lightboxClose"
        type="button"
        aria-label="Tutup">

        <i class="fa-solid fa-xmark"></i>

    </button>


    <button
        id="lightboxPrev"
        class="lightboxPrev"
        type="button"
        aria-label="Sebelum">

        <i class="fa-solid fa-chevron-left"></i>

    </button>


    <img
        id="lightboxImage"
        src=""
        alt="Momen tetamu">


    <button
        id="lightboxNext"
        class="lightboxNext"
        type="button"
        aria-label="Seterusnya">

        <i class="fa-solid fa-chevron-right"></i>

    </button>

</div>

<!-- =====================================================
     MAIN JAVASCRIPT
===================================================== -->

<script
    type="module"
    src="script.js">
</script>


</body>

</html>
